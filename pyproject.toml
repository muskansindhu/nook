[project]
name = "nook"
version = "0.1.0"
description = "Local-first, terminal-native reader for developer articles"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "textual>=0.80",
  "rich>=13",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "platformdirs>=4",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[project.scripts]
nook = "nook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
